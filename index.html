<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nouvura – Visite virtuelle du studio</title>
<meta name="description" content="Visite virtuelle 360° du studio créatif Nouvura, Algérie. Tout a commencé par une idée.">
<meta name="theme-color" content="#FFC800">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC800;--k:#101010;--r:#E3170A;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--k);color:#fff;font-family:'Bricolage Grotesque','Cairo',system-ui,sans-serif}
#c{position:fixed;inset:0;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.frame{position:fixed;inset:calc(12px + var(--sa)) 12px calc(12px + var(--sb)) 12px;border:1px solid rgba(255,255,255,.5);pointer-events:none;z-index:5}
.top{position:fixed;top:calc(24px + var(--sa));left:26px;right:26px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:6}
.chip{background:var(--y);padding:6px 12px;border-radius:2px;display:flex;align-items:center;min-height:40px;color:var(--k);font-weight:800;letter-spacing:-.02em}
.chip img{height:28px;display:block}
.title{position:fixed;top:calc(30px + var(--sa));left:50%;transform:translateX(-50%);font-weight:700;font-size:1.05rem;text-shadow:0 1px 12px rgba(0,0,0,.7);z-index:6;pointer-events:none;white-space:nowrap}
.grp{display:flex;gap:6px}
.b{background:rgba(16,16,16,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;min-height:40px;min-width:40px;border-radius:2px;font:inherit;font-size:.85rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.b:hover,.b[aria-pressed=true],.b.on{background:var(--y);color:var(--k);border-color:var(--y)}
.b:focus-visible,.cta:focus-visible,.hs:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.rail{position:fixed;bottom:calc(26px + var(--sb));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 52px);overflow-x:auto;padding:6px;background:rgba(16,16,16,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:3px;z-index:6;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .b{white-space:nowrap;border-color:transparent;background:transparent}
.rail .b:hover,.rail .b.on{background:var(--y);color:var(--k)}
.info{position:fixed;left:26px;bottom:calc(88px + var(--sb));width:min(340px,calc(100% - 52px));background:rgba(16,16,16,.74);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 18px;border-left:3px solid var(--r);z-index:6;transition:opacity .35s,transform .35s}
.info.off{opacity:0;transform:translateY(10px);pointer-events:none}
.info h2{font-size:1.2rem;margin-bottom:6px;letter-spacing:-.01em}
.info p{font-size:.92rem;line-height:1.55;color:#ececec}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{border:1px solid rgba(255,200,0,.65);color:var(--y);padding:3px 9px;font-size:.78rem;border-radius:2px}
[dir=rtl] .info{left:auto;right:26px;border-left:0;border-right:3px solid var(--r)}
.hs{position:fixed;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid var(--y);background:rgba(16,16,16,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:4;cursor:pointer;display:grid;place-items:center;will-change:transform}
.hs i{width:12px;height:12px;border-radius:50%;background:var(--y)}
.hs::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--y);animation:pl 2.2s ease-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.hs span{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--k);color:#fff;padding:5px 10px;font-size:.8rem;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;border-radius:2px}
.hs:hover span,.hs:focus-visible span{opacity:1}
.toast{position:fixed;top:calc(86px + var(--sa));left:50%;transform:translate(-50%,-8px);background:var(--y);color:var(--k);padding:8px 16px;font-weight:700;font-size:.88rem;border-radius:2px;z-index:7;opacity:0;transition:.4s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center}
#intro.gone{display:none}
.cur{position:absolute;left:0;right:0;height:50.5%;background:var(--y);transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
.cur.t{top:0}.cur.b{bottom:0}
#intro.open .t{transform:translateY(-101%)}
#intro.open .b{transform:translateY(101%)}
.in{position:relative;text-align:center;color:var(--k);padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .4s}
#intro.open .in{opacity:0;pointer-events:none}
.in img{max-height:96px;max-width:70vw}
.in h1{font-size:clamp(3rem,13vw,7rem);font-weight:800;letter-spacing:-.04em;line-height:.95}
.in p{font-size:clamp(1rem,3.2vw,1.3rem);font-weight:500}
.cta{background:var(--k);color:var(--y);border:0;padding:15px 32px;font:inherit;font-weight:700;font-size:1rem;border-radius:2px;cursor:pointer;margin-top:8px;transition:background .2s,color .2s}
.cta:hover:not(:disabled){background:var(--r);color:#fff}
.cta:disabled{opacity:.55;cursor:wait}
.in .b{background:transparent;color:var(--k);border-color:rgba(16,16,16,.45);backdrop-filter:none}
.in .b:hover,.in .b[aria-pressed=true]{background:var(--k);color:var(--y);border-color:var(--k)}
@media(max-width:700px){.title,.fs,.rot{display:none}.top{left:22px;right:22px}.info{bottom:calc(84px + var(--sb));left:22px;right:22px;width:auto}[dir=rtl] .info{left:22px;right:22px}}
@media(prefers-reduced-motion:reduce){.hs::after{animation:none}.cur{transition-duration:.01s}}
</style>
</head>
<body>
<div id="c"></div>
<div class="frame"></div>
<div class="title" id="ttl"></div>
<div class="top">
  <div class="chip"><img src="logo.png" alt="Nouvura" onerror="this.replaceWith(document.createTextNode('Nouvura'))"></div>
  <div class="grp" id="tools"></div>
</div>
<aside class="info off" id="info" aria-live="polite"></aside>
<nav class="rail" id="rail"></nav>
<div class="toast" id="toast"></div>
<div id="intro">
  <div class="cur t"></div><div class="cur b"></div>
  <div class="in">
    <img src="logo.png" alt="" onerror="this.remove()">
    <h1>Nouvura</h1>
    <p id="tag"></p>
    <div class="grp" id="ilang"></div>
    <button class="cta" id="go" disabled></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const SITE='https://nouvura.github.io/Nouvura/';

/* ===== CONFIG : modifiez ici les pièces =====
   flat : largeur en degrés si l’image n’est pas un vrai 360° (affichée en fenêtre) ; y0 : direction de départ
   src : noms de fichiers (à la racine, à côté de index.html)
   hs  : points cliquables { to: index de la pièce, yaw: direction (0-360), pitch: hauteur }
   Astuce : Shift + clic sur le panorama affiche yaw/pitch pour placer un point. */
const ROOMS=[
 {src:['room1.jpg','room1.jpeg','room1.png','room1.webp','1000002026.png'],flat:100,y0:0,
  hs:[{to:1,yaw:40,pitch:0},{to:2,yaw:-30,pitch:-12}],
  t:{fr:'Accueil',ar:'الاستقبال',en:'Reception'},
  d:{fr:'Bienvenue chez Nouvura, studio créatif en Algérie. Tout a commencé par une idée.',ar:'مرحباً بكم في Nouvura، استوديو إبداعي في الجزائر. كل شيء بدأ بفكرة.',en:'Welcome to Nouvura, a creative studio in Algeria. It all started with an idea.'},
  g:{fr:[],ar:[],en:[]}},
 {src:['room2.jpg','room2.jpeg','room2.png','room2.webp','1000002028.png'],
  hs:[{to:0,yaw:342,pitch:-3},{to:2,yaw:260,pitch:-8}],
  t:{fr:'Studio de design',ar:'استوديو التصميم',en:'Design studio'},
  d:{fr:'Ici, les idées deviennent identité visuelle, design graphique, interfaces UI/UX, infographie et sites web.',ar:'هنا تتحول الأفكار إلى هوية بصرية وتصميم غرافيكي وواجهات UI/UX وإنفوغرافيك ومواقع ويب.',en:'Here ideas become visual identity, graphic design, UI/UX interfaces, infographics and websites.'},
  g:{fr:['Design graphique','UI/UX','Infographie','Web'],ar:['التصميم الغرافيكي','UI/UX','الإنفوغرافيك','الويب'],en:['Graphic design','UI/UX','Infographics','Web']}},
 {src:['room3.jpg','room3.jpeg','room3.png','room3.webp','1000002025.png'],
  hs:[{to:1,yaw:85,pitch:-8},{to:0,yaw:335,pitch:-6}],
  t:{fr:'Atelier de production',ar:'ورشة الإنتاج',en:'Production workshop'},
  d:{fr:'Impression grand format, impression 3D, découpe de vinyle et finition : là où le design devient objet.',ar:'طباعة بالحجم الكبير وطباعة ثلاثية الأبعاد وقص الفينيل والتشطيب: حيث يتحول التصميم إلى منتج.',en:'Large-format and 3D printing, vinyl cutting and finishing: where design becomes an object.'},
  g:{fr:['Impression grand format','Impression 3D','Découpe vinyle'],ar:['الطباعة بالحجم الكبير','الطباعة ثلاثية الأبعاد','قص الفينيل'],en:['Large-format printing','3D printing','Vinyl cutting']}}
];
const T={
 fr:{enter:'Entrer dans le studio',load:'Chargement…',hint:'Glissez pour regarder autour de vous',site:'Site',info:'À propos de cette pièce',fs:'Plein écran',rot:'Rotation automatique',tag:'Tout a commencé par une idée',go:'Aller à '},
 ar:{enter:'ادخل الاستوديو',load:'جارٍ التحميل…',hint:'اسحب للنظر حولك',site:'الموقع',info:'عن هذه القاعة',fs:'ملء الشاشة',rot:'دوران تلقائي',tag:'كل شيء بدأ بفكرة',go:'الذهاب إلى '},
 en:{enter:'Enter the studio',load:'Loading…',hint:'Drag to look around',site:'Site',info:'About this room',fs:'Fullscreen',rot:'Auto-rotate',tag:'It all started with an idea',go:'Go to '}
};
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
let lang='fr';try{lang=localStorage.getItem('nv-lang')||'fr'}catch(e){}
if(!T[lang])lang='fr';

/* ===== Three.js ===== */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=THREE.sRGBEncoding;
$('#c').appendChild(R.domElement);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,1,.1,1100);
const maxT=R.capabilities.maxTextureSize,aniso=R.capabilities.getMaxAnisotropy();
const geo=new THREE.SphereGeometry(500,64,40);geo.scale(-1,1,1);
const rad=THREE.MathUtils.degToRad;
let lon=0,lat=0,fov=75,vlon=0,vlat=0,cur=-1,A=null,busy=false,rot=!matchMedia('(prefers-reduced-motion:reduce)').matches,last=performance.now(),HS=[];
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

function mk(src){
 let s=src;const w=src.width,h=src.height;
 if(Math.max(w,h)>maxT){const k=maxT/Math.max(w,h),c=document.createElement('canvas');c.width=Math.floor(w*k);c.height=Math.floor(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);s=c}
 const t=new THREE.Texture(s);t.encoding=THREE.sRGBEncoding;t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;t.anisotropy=aniso;t.needsUpdate=true;return t;
}
function ph(i){
 const c=document.createElement('canvas');c.width=2048;c.height=1024;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,1024);gr.addColorStop(0,'#1a1a1a');gr.addColorStop(.5,'#FFC800');gr.addColorStop(1,'#101010');
 g.fillStyle=gr;g.fillRect(0,0,2048,1024);g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=2;
 for(let x=0;x<=2048;x+=128){g.beginPath();g.moveTo(x,0);g.lineTo(x,1024);g.stroke()}
 for(let y=0;y<=1024;y+=128){g.beginPath();g.moveTo(0,y);g.lineTo(2048,y);g.stroke()}
 g.fillStyle='#101010';g.font='700 56px sans-serif';g.textAlign='center';
 for(let k=0;k<4;k++)g.fillText(ROOMS[i].src[0],256+k*512,540);
 return mk(c);
}
const cache={};
/* Les images sont cherchées dans le dossier de index.html, puis un ou deux niveaux au-dessus, puis à la racine du dépôt GitHub */
const BASES=['','../','../../',location.hostname.endsWith('github.io')?'/'+location.pathname.split('/')[1]+'/':'/'];
function load(i){
 return cache[i]||(cache[i]=new Promise(res=>{
  const q=[];BASES.forEach(b=>ROOMS[i].src.forEach(f=>q.push(b+f)));
  (function nx(){
   if(!q.length)return res(ph(i));
   const im=new Image();im.onload=()=>res(mk(im));im.onerror=nx;im.src=q.shift();
  })();
 }));
}
function sphere(t,o,i){
 const mm=(g,c)=>new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:o,depthWrite:false,color:c||0xffffff}));
 const f=ROOMS[i].flat;
 if(!f){const m=mm(geo);S.add(m);return m}
 const w=rad(f),h=w/2,p=new THREE.SphereGeometry(490,48,24,-w/2,w,Math.PI/2-h/2,h);p.scale(-1,1,1);
 const g=new THREE.Group();g.add(mm(geo,0x4a4a4a),mm(p));S.add(g);return g;
}
const op=(m,o)=>m.traverse(c=>{if(c.material)c.material.opacity=o});
const P3=(yaw,pit)=>{const p=rad(90-pit),t=rad(yaw);return new THREE.Vector3(400*Math.sin(p)*Math.cos(t),400*Math.cos(p),400*Math.sin(p)*Math.sin(t))};

/* ===== Navigation entre pièces ===== */
const tw=(ms,fn)=>new Promise(r=>{const t=performance.now();(function s(){const k=Math.min(1,(performance.now()-t)/ms);fn(k);k<1?requestAnimationFrame(s):r()})()});
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
async function go(i,yaw){
 if(busy||i===cur)return;busy=true;vlon=vlat=0;
 const tex=await load(i);
 if(cur<0){A=sphere(tex,1,i);cur=i;busy=false;buildHS();UI();preload();return}
 const B=sphere(tex,0,i),l0=lon,f0=fov,tg=ROOMS[i].y0!=null?ROOMS[i].y0:yaw,dl=tg==null?0:((tg-lon+540)%360)-180;
 clearHS();
 await tw(950,k=>{const e=ease(k);lon=l0+dl*e;fov=f0*(1-.3*e);op(B,Math.max(0,(k-.35)/.65))});
 S.remove(A);A.traverse(c=>{if(c.material)c.material.dispose()});A=B;cur=i;buildHS();UI();
 await tw(700,k=>{fov=f0*.7+f0*.3*(1-Math.pow(1-k,3))});
 busy=false;
 try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}
async function preload(){for(let i=0;i<ROOMS.length;i++){await load(i)}}
function clearHS(){HS.forEach(h=>h.b.remove());HS=[]}
function buildHS(){
 clearHS();
 ROOMS[cur].hs.forEach(h=>{
  const b=document.createElement('button');b.className='hs';b.innerHTML='<i></i><span></span>';
  b.onclick=e=>{e.stopPropagation();go(h.to,h.yaw)};
  document.body.appendChild(b);HS.push({b,p:P3(h.yaw,h.pitch),h});
 });
 labels();
}
function labels(){HS.forEach(o=>{const n=ROOMS[o.h.to].t[lang];o.b.querySelector('span').textContent=n;o.b.setAttribute('aria-label',T[lang].go+n)})}

/* ===== Interface ===== */
const L=T;
function mkLang(box){
 box.innerHTML='';
 ['fr','ar','en'].forEach(c=>{const b=document.createElement('button');b.className='b';b.textContent=c.toUpperCase();b.dataset.l=c;b.onclick=()=>setLang(c);box.appendChild(b)});
}
function setLang(c){
 lang=c;try{localStorage.setItem('nv-lang',c)}catch(e){}
 UI();
}
function UI(){
 const t=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 $('#tag').textContent=t.tag;
 const g=$('#go');g.textContent=ready?t.enter:t.load;
 $('#tools').querySelectorAll('[data-k]').forEach(b=>{b.title=b.getAttribute('aria-label')=t[b.dataset.k]});
 $('#rail').innerHTML='';
 ROOMS.forEach((r,i)=>{const b=document.createElement('button');b.className='b'+(i===cur?' on':'');b.textContent=r.t[lang];b.onclick=()=>go(i);$('#rail').appendChild(b)});
 if(cur>=0){
  const r=ROOMS[cur];$('#ttl').textContent=r.t[lang];document.title='Nouvura – '+r.t[lang];
  const f=$('#info');f.innerHTML='';
  const h=document.createElement('h2');h.textContent=r.t[lang];const p=document.createElement('p');p.textContent=r.d[lang];f.append(h,p);
  if(r.g[lang].length){const d=document.createElement('div');d.className='tags';r.g[lang].forEach(x=>{const s=document.createElement('span');s.textContent=x;d.appendChild(s)});f.appendChild(d)}
 }
 labels();
}
(function tools(){
 const box=$('#tools');mkLang(box);
 const add=(k,txt,cls,fn)=>{const b=document.createElement('button');b.className='b '+cls;b.textContent=txt;b.dataset.k=k;b.onclick=fn;box.appendChild(b);return b};
 add('rot','⟳','rot',e=>{rot=!rot;e.currentTarget.setAttribute('aria-pressed',rot)}).setAttribute('aria-pressed',rot);
 add('fs','⤢','fs',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
 add('info','i','',e=>{const o=$('#info').classList.toggle('off');e.currentTarget.setAttribute('aria-pressed',!o)});
 const a=document.createElement('a');a.className='b';a.href=SITE;a.dataset.k='site';a.textContent='Site';box.appendChild(a);
 mkLang($('#ilang'));
})();
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3800)};

/* ===== Contrôles ===== */
const host=$('#c'),PT=new Map();let sx,sy,slon,slat,moved=0,pd=0;
const dist=()=>{const a=[...PT.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
host.addEventListener('pointerdown',e=>{
 if(busy)return;PT.set(e.pointerId,[e.clientX,e.clientY]);host.setPointerCapture(e.pointerId);last=performance.now();
 if(PT.size===1){sx=e.clientX;sy=e.clientY;slon=lon;slat=lat;moved=0;vlon=vlat=0}else if(PT.size===2)pd=dist();
});
host.addEventListener('pointermove',e=>{
 if(!PT.has(e.pointerId)||busy)return;const o=PT.get(e.pointerId);PT.set(e.pointerId,[e.clientX,e.clientY]);last=performance.now();
 if(PT.size===2){const d=dist();fov=cl(fov-(d-pd)*.12,35,90);pd=d;return}
 const k=fov/innerHeight;
 lon=slon-(e.clientX-sx)*k;lat=cl(slat+(e.clientY-sy)*k,-85,85);
 vlon=-(e.clientX-o[0])*k;vlat=(e.clientY-o[1])*k;moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);
});
const up=e=>{
 if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);
 if(moved<6&&e.shiftKey&&e.type==='pointerup'){
  const v=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(cam).normalize();
  toast('yaw: '+Math.round(Math.atan2(v.z,v.x)*180/Math.PI)+'  pitch: '+Math.round(Math.asin(v.y)*180/Math.PI));
 }
};
host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
host.addEventListener('wheel',e=>{e.preventDefault();fov=cl(fov+e.deltaY*.04,35,90);last=performance.now()},{passive:false});
addEventListener('keydown',e=>{
 const k=e.key,s=3;last=performance.now();
 if(k==='ArrowLeft')vlon=-s*.3;else if(k==='ArrowRight')vlon=s*.3;else if(k==='ArrowUp')vlat=s*.3;else if(k==='ArrowDown')vlat=-s*.3;
 else if(k==='+'||k==='=')fov=cl(fov-5,35,90);else if(k==='-')fov=cl(fov+5,35,90);
 else if(/^[1-9]$/.test(k)&&ROOMS[+k-1])go(+k-1);
 else if(k==='f'||k==='F')$('.fs').click();
});

/* ===== Boucle ===== */
let pt=performance.now();
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(50,now-pt);pt=now;
 if(!busy&&!PT.size){
  lon+=vlon;lat=cl(lat+vlat,-85,85);vlon*=.92;vlat*=.92;
  if(rot&&now-last>5000&&Math.abs(vlon)<.01)lon+=dt*.004;
 }
 cam.fov=fov;cam.updateProjectionMatrix();
 const p=rad(90-lat),t=rad(lon);cam.lookAt(500*Math.sin(p)*Math.cos(t),500*Math.cos(p),500*Math.sin(p)*Math.sin(t));
 cam.updateMatrixWorld();
 R.render(S,cam);
 HS.forEach(o=>{const v=o.p.clone().project(cam),on=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
  o.b.style.display=on?'grid':'none';
  if(on)o.b.style.transform='translate3d('+((v.x*.5+.5)*innerWidth)+'px,'+((-v.y*.5+.5)*innerHeight)+'px,0)'});
}
requestAnimationFrame(loop);

/* ===== Démarrage ===== */
let ready=false;
const h0=parseInt(location.hash.slice(1),10),start=h0>=1&&h0<=ROOMS.length?h0-1:0;
UI();
go(start).then(()=>{ready=true;$('#go').disabled=false;UI();$('#go').focus({preventScroll:true})});
$('#go').onclick=()=>{
 $('#intro').classList.add('open');
 setTimeout(()=>{$('#intro').classList.add('gone');$('#info').classList.remove('off');toast(T[lang].hint)},1200);
 last=performance.now();
};
})();
</script>
